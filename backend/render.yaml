services:
  - type: web
    name: divine-gas-backend
    env: node
    region: oregon
    buildCommand: cd backend; npm install
    startCommand: cd backend; npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        fromDatabase:
          name: divine-gas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORT_CODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false

databases:
  - name: divine-gas-db
    databaseName: divine_gas
    user: divine_gas
    plan: free
    region: oregon
